services:

  retrieval:
    image: policycheck-ai-policycheck:latest
    container_name: policycheck-retrieval
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
    command: ["uvicorn", "retrieval_service:app", "--host", "0.0.0.0", "--port", "8001"]

  llm:
    image: policycheck-ai-policycheck:latest
    container_name: policycheck-llm
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_MODEL=${LLM_MODEL:-codellama:latest}
    command: ["uvicorn", "llm_service:app", "--host", "0.0.0.0", "--port", "8002"]

  orchestration:
    image: policycheck-ai-policycheck:latest
    container_name: policycheck-orchestration
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_MODEL=${LLM_MODEL:-codellama:latest}
    depends_on:
      - retrieval
      - llm
    command: ["uvicorn", "orchestration_service:app", "--host", "0.0.0.0", "--port", "8000"]

services:

  retrieval:
    build: .
    image: policycheck-ai-policycheck:latest
    container_name: policycheck-retrieval
    restart: unless-stopped
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
    command: ["uvicorn", "retrieval_service:app", "--host", "0.0.0.0", "--port", "8001"]

  llm:
    build: .
    image: policycheck-ai-policycheck:latest
    container_name: policycheck-llm
    restart: unless-stopped
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:0.5b}
    command: ["uvicorn", "llm_service:app", "--host", "0.0.0.0", "--port", "8002"]

  orchestration:
    build: .
    image: policycheck-ai-policycheck:latest
    container_name: policycheck-orchestration
    restart: unless-stopped
    ports:
      - "8003:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:0.5b}
    depends_on:
      - retrieval
      - llm
    command: ["uvicorn", "orchestration_service:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build: .
    image: policycheck-ai-policycheck:latest
    container_name: policycheck-ui
    restart: unless-stopped
    ports:
      - "8000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:0.5b}
      - RETRIEVAL_SERVICE_URL=http://retrieval:8001
      - LLM_SERVICE_URL=http://llm:8002
      - ORCHESTRATION_SERVICE_URL=http://orchestration:8000
    depends_on:
      - retrieval
      - llm
      - orchestration
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8080"]


